# Render Blueprint: the API only. The React site is deployed separately on Netlify (see netlify.toml).
services:
  - type: web
    name: navbharat24x7-api
    runtime: node
    plan: free
    buildCommand: npm install -w server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # Render asks for these two when you create the service:
      - key: MONGODB_URI # your Atlas string, with the real password and a database name
        sync: false
      - key: CLIENT_ORIGIN # your Netlify site URL, e.g. https://your-site.netlify.app (a placeholder is fine at first; update it later)
        sync: false
      # Generated once by Render and kept stable across restarts.
      - key: JWT_SECRET
        generateValue: true
