# Netlify hosts the React app only; the API runs on Render.
# In Netlify → Site settings → Environment variables, set:
#   VITE_API_URL = https://<your-render-service>.onrender.com/api
[build]
  command = "npm install --include=dev && npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy /api requests to Render backend API so CORS is eliminated and VITE_API_URL is automatic
[[redirects]]
  from = "/api/*"
  to = "https://navbharat24x7-api.onrender.com/api/:splat"
  status = 200

# Single-page app: every path serves index.html so deep links (/article/…) work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
